about:
  heading: このサイトについて
  lead: >-
    香川県の観光施設と交通について、今日・今週行けるかどうかを、公式ページの記載だけを根拠に
    お伝えするサイトです。施設の予約・案内は行っていません。
  how_title: どう作っているか
  how_source: >-
    開館時間・休館日・料金は、各施設と交通事業者の公式ページ、県・市町、観光協会のページから
    毎日取得しています。公式サイトの説明文は転載していません。
  how_verdict: >-
    その日の状態は「開いている」「休み」「不明」の 3 つで表します。材料が足りないときや
    書かれていることが食い違うときは、推測せず「不明」と出して一次情報へご案内します。
  how_quote: >-
    数値や時間は公式ページの原文から機械的に取り出しています。判定には必ず原文の引用・
    一次情報の URL・取得日時を添えています。
  how_stale: >-
    公式ページを 14 日間取得できていない施設は、規則のうえでは開館日でも「不明」に落とします。
  operator_title: 運営者
  operator: 運営者
  contact_note: >-
    掲載内容の訂正のご依頼、施設・事業者からのご連絡、巡回の停止のご依頼は、この連絡先から
    お願いします。お預かりする情報の扱いはプライバシーポリシーに記しています。
  bot_title: 巡回について
  bot_text: >-
    本サイトは次の User-Agent で各サイトを巡回しています。robots.txt を守り、同じサイトへの
    アクセスは数秒以上の間隔を空けています。巡回を止めてほしい場合は上記の連絡先へお知らせください。
  ads_title: 広告について
  ads_none: >-
    現在、広告（アフィリエイトリンク）は掲載していません。掲載する場合は、その枠に広告である旨を
    明記し、掲載する施設の選び方や並び順には影響させません。
  ads_live: >-
    一部の枠に広告（アフィリエイトリンク）を掲載しています。広告である旨をその枠に明記しており、
    リンク先での申込みにより当サイトが報酬を受け取ることがあります。掲載する施設の選び方や
    並び順には影響しません。
  data_link: データの出典一覧
  disclaimer_title: 免責
  disclaimer: >-
    本サイトは各施設・交通事業者の公式ページから開館時間・休館日・料金などを機械的に取得し、
    一次情報へのリンクとともに掲載しています。公式サイトの説明文は転載していません。
    「今日行けるか」の判定は取得時点の情報からの計算で、確定できない場合は「不明」と表示します。
    お出かけの前に必ず公式ページでご確認ください。
privacy:
  heading: プライバシーポリシー
  lead: お預かりする情報と、外部サービスの利用についてお伝えします。
  form_title: お問い合わせでお預かりする情報
  form_what: >-
    お問い合わせフォームに入力された内容（お名前、メールアドレス、種別、本文、返信の言語、
    送信日時）は Google フォームを通じて運営者の Google スプレッドシートに保存し、
    お問い合わせへの対応と、その記録のために使います。
  form_ai: >-
    お問い合わせの分類と自動返信の文面の作成に AI（Anthropic 社の Claude）を使っており、
    本文は Anthropic 社の API に送られます。自動返信にはその旨を明記しています。
  form_issue: >-
    掲載内容の訂正など運営者の対応が必要なものは、記録として本文の一部と対象の URL を
    運営者の非公開の作業管理ツール（GitHub Issue）に転記します。お名前とメールアドレスは
    転記しません。
  form_keep: >-
    お預かりした情報は対応の完了後も記録として一定期間保管し、法令に基づく場合を除いて
    第三者には提供しません。削除をご希望の場合は同じフォームからお知らせください。
  site_title: サイトの閲覧について
  cookies: 本サイト自体は Cookie を使用していません。
  analytics: >-
    アクセス状況の把握に Cloudflare Web Analytics を使っています。Cookie は使わず、個人を
    特定する情報も集めません。集計されるのは開かれたページの URL・参照元・大まかな地域・
    ブラウザの種類・表示にかかった時間です。
  maps: >-
    地図を表示するページでは Google マップの埋め込みを使っています。表示のときに Google への
    通信が発生し、Google のプライバシーポリシーが適用されます。
  maps_link_only: >-
    地図は Google マップへの外部リンクとして掲載しており、ページを開いただけでは Google への
    通信は発生しません。
  ads_none: 広告（アフィリエイトリンク）は掲載していません。
  ads_live: >-
    一部の枠に広告（アフィリエイトリンク）を掲載しています。広告の配信事業者が Cookie などを
    使う場合があります。
  contact_title: お問い合わせ
  contact: "このポリシーについてのお問い合わせは次の連絡先へお願いします:"
