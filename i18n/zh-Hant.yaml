about:
  heading: 關於本網站
  lead: >-
    香川縣的觀光設施與交通，今天與本週能不能去。所有內容只依據官方網頁的記載。
    本網站不提供預約或代辦服務。
  coverage: >-
    目前收錄的只有香川縣（{spots} 處與 {routes} 條路線，包含瀨戶內海的島嶼）。
    待這套做法在香川確認可行後，會以相同的機制增加其他縣。其他縣尚未定出時間。
  how_title: 本網站如何製作
  how_source: >-
    開館時間、休館日與費用，每天從各設施與交通業者的官方網頁，以及縣、市町、觀光協會的網頁取得。
    我們不轉載官方網頁的說明文字。
  how_verdict: >-
    每一天的狀況以「有開」「休息」「不明」三種表示。資料不足或彼此矛盾時，不做推測，
    顯示「不明」並引導至一手資訊。
  how_quote: >-
    時間與金額都由機器從官方網頁的原文取出。每項判斷都附上原文引用、一手資訊的連結與擷取時間。
  how_stale: >-
    若已有 14 天無法取得該設施的官方網頁，即使依規則應為開館日，也會降為「不明」。
  operator_title: 營運者
  operator: 營運者
  contact_note: >-
    刊載內容的訂正、設施與業者的聯絡、停止爬取的要求，都歡迎透過以下聯絡方式告知。
    我們如何處理您提供的資訊，記載於隱私權政策。
  bot_title: 關於爬取
  bot_text: >-
    本網站以下列 User-Agent 爬取各網頁，遵守 robots.txt，對同一網站的存取間隔數秒以上。
    若希望我們停止爬取，請透過上述聯絡方式告知。
  ads_title: 關於廣告
  ads_none: >-
    目前未刊登廣告（聯盟行銷連結）。若日後刊登，會在該處明確標示為廣告，
    且不影響我們收錄哪些地點與其排列順序。
  ads_live: >-
    部分版位刊登廣告（聯盟行銷連結），並在該處明確標示為廣告。
    透過連結完成預訂時本網站可能獲得報酬，但不影響收錄的地點與排列順序。
  data_link: 資料來源一覽
  disclaimer_title: 免責聲明
  disclaimer: >-
    本網站從各設施與交通業者的官方網頁機械性取得開館時間、休館日與費用等資訊，並附上一手資訊的連結。
    我們不轉載官方網頁的說明文字。每一天的判斷是依取得時的資訊計算而成，無法確定時會顯示「不明」。
    出發前請務必查看官方網頁。
privacy:
  heading: 隱私權政策
  lead: 說明我們會保管哪些資訊，以及本網站使用的外部服務。
  form_title: 聯絡表單取得的資訊
  form_what: >-
    您在聯絡表單填寫的內容（姓名、電子郵件、類別、內容、回覆語言與送出時間），
    會透過 Google 表單儲存於營運者的 Google 試算表，用於回覆與保留紀錄。
  form_ai: >-
    分類與自動回覆的文字由 AI（Anthropic 的 Claude）產生，因此內容會傳送至 Anthropic 的 API。
    自動回覆中會明確說明這一點。
  form_issue: >-
    需要營運者處理的事項（例如刊載內容的訂正），會將部分內容與相關網址轉記至營運者非公開的
    工作管理工具（GitHub Issue）。姓名與電子郵件不會轉記。
  form_keep: >-
    處理完成後仍會保留一段期間作為紀錄，除法令規定外不提供給第三方。
    如需刪除，請透過同一表單告知。
  site_title: 關於瀏覽本網站
  cookies: 本網站本身不使用 Cookie。
  analytics: >-
    我們使用 Cloudflare Web Analytics 了解使用狀況。不使用 Cookie，也不蒐集可識別個人的資訊，
    僅統計網址、來源、大略地區、瀏覽器種類與頁面載入時間。
  maps: >-
    顯示地圖的頁面使用 Google 地圖的嵌入功能。載入時會與 Google 通訊，並適用 Google 的隱私權政策。
  maps_link_only: >-
    地圖以外部連結方式連往 Google 地圖，僅開啟頁面不會與 Google 通訊。
  ads_none: 目前未刊登廣告（聯盟行銷連結）。
  ads_live: >-
    部分版位刊登廣告（聯盟行銷連結），廣告服務商可能使用 Cookie。
  contact_title: 聯絡我們
  contact: "關於本政策的詢問，請透過以下聯絡方式:"
