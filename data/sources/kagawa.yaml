      quote: "Copyright © kagawa Prefecture Tourism Association. ALL RIGHTS RESERVED."
      url: https://www.my-kagawa.jp/ritsuringarden/
      checked_on: 2026-09-12
    policy: crawl
    official_url: https://www.my-kagawa.jp/ritsuringarden/
    pages:
      - url: https://www.my-kagawa.jp/ritsuringarden/
        kind: spot_detail
      - url: https://www.my-kagawa.jp/ritsuringarden/news/category:information
        kind: notice
    allow_hosts: [www.my-kagawa.jp]
    max_pages: 8
    spot:
      spot_id: ritsurin
      area: takamatsu
      category: garden
      names:
        ja: {text: 栗林公園, source: ja}
        en: {text: Ritsurin Garden, source: glossary}
