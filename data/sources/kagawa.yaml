# 香川県の観光施設と交通（ADR 0001）。第 1 フェーズの手始めの 14 件。
#
# 各エントリは sitemill の Source（巡回設定）と、このサービスの spot / transport を兼ねる。
# policy: crawl にできるのは、運営主体が公式と根拠づけできる Source だけ（ADR 0009）。
# operator_evidence には根拠となる記述の引用と URL、確認日を必ず書く。
#
# commons_category は**推測していない**。施設の公式サイトか Wikipedia 日本語版の記事から
# リンクされている Commons カテゴリを辿って確定したもので、辿れなかったものは空にしてある
# （tools/resolve_commons.py、結果は data/runs/commons-categories.json）。
#
# policy: pending は「運営主体を機械的に判定できなかった」もの。絶対に巡回せず、
# レビュー行列に残す。試した情報源は notes に書いてある。
sources:
