    policy: crawl
    official_url: https://www.my-kagawa.jp/ritsuringarden/
    pages:
      - url: https://www.my-kagawa.jp/ritsuringarden/
        kind: spot_detail
      - url: https://www.my-kagawa.jp/ritsuringarden/news/category:information
        kind: notice
      - url: https://www.my-kagawa.jp/access
        kind: spot_access  # 発見（S6）: 交通
      - url: https://www.my-kagawa.jp/ritsuringarden/feature/ritsuringarden/guide
        kind: spot_hours  # 発見（S6）: 利用案内
      - url: https://www.my-kagawa.jp/ritsuringarden/feature/ritsuringarden/access
        kind: spot_fees  # 発見（S6）: アクセス
