# サイト設定。秘密情報は書かない（.env に置く）。
[site]
id = "japan-open-today"
name = "Japan Open Today"
# 基準 URL はここ 1 か所だけで差し替える。canonical / hreflang / sitemap / robots はここから決まる。
# 本番ドメイン（2026-09-13 切替）。Cloudflare のカスタムドメインは apex と www の両方を持ち、
# www と japan-open-today.pages.dev は Bulk Redirects で apex へ 301 する。
# CI は配置前に、生成物がこの値を指していることを検査する（--expect-base）。変えるときは
# .github/workflows/pipeline.yml の --expect-base も一緒に変える。
base_url = "https://japan-open-today.com"
service = "japan_open_today.service:service"
# 基準言語。各言語の URL 接頭辞は下の [[locales]]（ADR 0005）
language = "ja"
description = "香川県の観光施設と交通について、今日・今週の開館状況と運航状況を、公式サイトの原文から機械抽出した事実だけで提供します。"

# 言語（sitemill ADR 0016）。label は言語切り替えに出すので、その言語自身の表記で書く。
# 表示名（ロゴ横）は i18n/<locale>.yaml の site.name_short に置く。site.name は正式名で固定。
[[locales]]
code = "ja"
path = ""
label = "日本語"
default = true

[[locales]]
code = "en"
path = "en"
label = "English"

[[locales]]
code = "zh-Hant"
path = "zh-hant"
label = "繁體中文"

[operator]
# 3 言語共通の 1 つの名前にする。役割の語（運営者 / Operator / 營運者）は i18n の
# trust.operator にあるので、名前に「運営」を足すと日本語ページで重なる。
# sitemill の [operator] name はロケール別に持てない（ADR 0016）
name = "Japan Open Today"
# 連絡先は Google フォーム（tools/contact_form/ の setup() で作る）。
# フォームができるまでは「準備中」のまま。ダミーの URL は置かない
contact = "準備中"

[paths]
data = "data"
templates = "templates"
static = "static"
dist = "dist"
fixtures = "tests/fixtures"

[crawl]
default_delay_seconds = 3.0
jitter_seconds = 1.0
timeout_seconds = 30.0
max_pages_per_source = 40   # サイト全体の上限。各 source の max_pages がこれ以下なら source 側が優先
max_workers = 6             # ホスト並列数（sitemill ADR 0013）。1 ホストあたりの間隔は並列でも縮まらない
# 変化率に応じて巡回間隔を延ばす（相手サイトへの負荷を下げる）。下限は週 1 回（ADR 0007）
adaptive_interval = true
fresh_days = 7              # この日数内に変化があれば毎日
slow_after_days = 28        # これ以上変化が無ければ最長間隔
mid_interval_days = 3       # その中間
max_interval_days = 7       # 最長（＝週 1 回）
# お知らせ・運休告知は変化率に関わらず毎日取りに行く（ADR 0007）。
# 臨時休業と運休は「変化の少ないページに突然出る」ので、間隔を延ばすと取り逃がす
always_daily_kinds = ["notice"]
# 公式ページの取得がこの日数できていなければ、規則上は開館日でも判定を「不明」に落とす（ADR 0004）
stale_after_days = 14

[llm]
provider = "anthropic"
model = "claude-haiku-4-5"
max_input_chars = 60000
max_output_tokens = 32000
temperature = 0.0

[analytics]
provider = "cloudflare"
